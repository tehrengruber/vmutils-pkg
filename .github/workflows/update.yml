name: Update PKGBUILD

# Checks upstream daily and opens a pull request when there is a new release.
# The build check on that PR decides whether it lands: auto-merge takes it as
# soon as the package builds. The PR is not a review gate — it is the record of
# what changed, and the thing to revert when a release turns out to ship a
# breaking change.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (default: latest upstream release)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the upstream release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(sed -n 's/^pkgver=//p' PKGBUILD)
          ./update.sh ${{ inputs.version }}
          after=$(sed -n 's/^pkgver=//p' PKGBUILD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"  >> "$GITHUB_OUTPUT"
          [ "$before" = "$after" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # A PAT, not GITHUB_TOKEN: a pull request opened with the workflow's
          # own token does not trigger workflow runs, so the build check would
          # never start and auto-merge would wait for it forever.
          token: ${{ secrets.UPDATE_PAT }}
          branch: update/${{ steps.bump.outputs.after }}
          title: "Update to ${{ steps.bump.outputs.after }}"
          commit-message: "Update to ${{ steps.bump.outputs.after }}"
          body: |
            Upstream released ${{ steps.bump.outputs.after }} (was ${{ steps.bump.outputs.before }}).

            pkgver and both checksums come from the GitHub release metadata.
            The build check on this pull request is what verifies the package
            actually builds and ships the expected files.

            Merged automatically. VictoriaMetrics ships breaking changes
            between releases, so the changelog is worth a look after the fact —
            revert this PR if it turns out to matter.

            https://github.com/VictoriaMetrics/VictoriaMetrics/releases/tag/v${{ steps.bump.outputs.after }}

      # Queued behind the build check rather than merged outright, so nothing
      # lands that has not been built. This needs branch protection on main
      # requiring the "build" check, and auto-merge enabled on the repository;
      # without them the merge fails with "Protected branch rules not
      # configured for this branch".
      #
      # The PR remains as the record of what changed and the thing to revert.
      # A required *review* would not work here: a token cannot approve the pull
      # request it opened itself.
      - name: Merge it once it builds
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PAT }}
        run: |
          gh pr merge --squash --auto --delete-branch \
             "${{ steps.pr.outputs.pull-request-number }}"
