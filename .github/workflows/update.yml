name: Update PKGBUILD

# Checks upstream daily and opens a pull request when there is a new release.
# Deliberately a PR and not a push: VictoriaMetrics ships breaking changes
# between releases, so the decision to take one stays with a person. Enable
# auto-merge on the PR if you would rather it flowed straight through.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (default: latest upstream release)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the upstream release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(sed -n 's/^pkgver=//p' PKGBUILD)
          ./update.sh ${{ inputs.version }}
          after=$(sed -n 's/^pkgver=//p' PKGBUILD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"  >> "$GITHUB_OUTPUT"
          [ "$before" = "$after" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Builds the package for real, in an Arch container, before proposing the
      # change. This is what catches an upstream that renames or restructures
      # its release tarball — the failure a checksum bump alone sails straight
      # past, and which would otherwise surface on the host at deploy time.
      - name: Build the package
        if: steps.bump.outputs.changed == 'true'
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euo pipefail -c '
            # The image ships no initialised keyring, so the archlinux-keyring
            # scriptlet fails during the upgrade below ("There is no secret key
            # available to sign with") and leaves signature checking on a
            # keyring nobody has vouched for.
            pacman-key --init
            pacman-key --populate
            pacman -Syu --noconfirm --needed base-devel
            useradd -m builder
            # The bind mount is the checkout itself, .git included, so hand
            # ownership back on the way out: otherwise the workspace is left
            # owned by the container uid and the runner can no longer write
            # .git (checkout post-cleanup and create-pull-request both fail).
            trap "chown -R $HOST_UID:$HOST_GID /pkg" EXIT
            chown -R builder /pkg
            sudo -u builder makepkg --noconfirm --nodeps
            # makepkg stages into pkg/<pkgname>/, and this PKGBUILD also
            # produces a -debug package, so inspect the real package
            # artifact rather than guessing at the staging path.
            shopt -s nullglob
            pkgs=(vmutils-[0-9]*.pkg.tar.*)
            test ${#pkgs[@]} -eq 1 || { echo "expected exactly one vmutils package, got: ${pkgs[*]:-none}"; exit 1; }
            contents=$(bsdtar -tf "${pkgs[0]}" | sed "s#^\./##")
            for f in usr/bin/vmagent usr/bin/vmalert usr/bin/vmalert-tool usr/bin/vmauth usr/bin/vmbackup usr/bin/vmctl usr/bin/vmrestore; do
              printf "%s\n" "$contents" | grep -qxF "$f" || { echo "missing from the built package: $f"; exit 1; }
            done
            echo "built and verified: usr/bin/vmagent usr/bin/vmalert usr/bin/vmalert-tool usr/bin/vmauth usr/bin/vmbackup usr/bin/vmctl usr/bin/vmrestore"
          '

      - name: Open a pull request
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # The build ran in this checkout, so the tree is full of sources and
          # built packages. Only the bump belongs in the commit.
          add-paths: PKGBUILD
          branch: update/${{ steps.bump.outputs.after }}
          title: "Update to ${{ steps.bump.outputs.after }}"
          commit-message: "Update to ${{ steps.bump.outputs.after }}"
          body: |
            Upstream released ${{ steps.bump.outputs.after }} (was ${{ steps.bump.outputs.before }}).

            pkgver and both checksums come from the GitHub release metadata, and
            the package built cleanly in an Arch container with the expected
            files present.

            Merged automatically. VictoriaMetrics ships breaking changes
            between releases, so the changelog is worth a look after the fact —
            revert this PR if it turns out to matter.

            https://github.com/VictoriaMetrics/VictoriaMetrics/releases/tag/v${{ steps.bump.outputs.after }}

      # Merges as soon as the required checks pass — which, since the container
      # build above runs before the PR is opened, is immediately. The PR remains
      # as the record of what changed and the thing to revert.
      #
      # This is auto-merge rather than an auto-approval: GITHUB_TOKEN cannot
      # approve a pull request it opened itself. If branch protection here ever
      # requires a review, this step needs a token belonging to a different
      # identity than the one that created the PR.
      - name: Merge it automatically
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --auto --delete-branch \
             "${{ steps.pr.outputs.pull-request-number }}"
